services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: youruser/simple-app:latest
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PASSWORD: rootpass
      DB_NAME: appdb
    depends_on:
      db:
        condition: service_healthy
